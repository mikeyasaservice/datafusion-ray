[package]
name = "datafusion_ray"
description = "DataFusion on Ray"
homepage = "https://github.com/apache/datafusion-ray"
repository = "https://github.com/apache/datafusion-ray"
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
version = "0.1.0-rc2"
edition = "2024"
readme = "README.md"
license = "Apache-2.0"
rust-version = "1.94"
build = "build.rs"

[dependencies]
anyhow = "1"
arrow = { version = "59", features = ["pyarrow", "ipc"] }
arrow-flight = "59"
async-stream = "0.3"
async-channel = "2.3"
bytesize = "1.3"
datafusion = { version = "55.1", features = ["avro"] }
# datafusion-python has no 55 release on crates.io yet; `main` is already on
# datafusion 55.1 / arrow 59 / pyo3 0.29.  Swap both to a crates.io version
# once Apache publishes it.
datafusion-python = { git = "https://github.com/apache/datafusion-python", rev = "516d20df7efca398aeead904d683efc9f8812949" }
datafusion-python-util = { git = "https://github.com/apache/datafusion-python", rev = "516d20df7efca398aeead904d683efc9f8812949" }
datafusion-proto = "55.1"
env_logger = "0.11"
futures = "0.3"
glob = "0.3.1"
itertools = "0.14"
local-ip-address = "0.6"
log = "0.4"
object_store = { version = "0.13", features = [
  "aws",
  "gcp",
  "azure",
  "http",
] }
parking_lot = { version = "0.12", features = ["deadlock_detection"] }
prost = "0.14"
pyo3 = { version = "0.29", features = [
  "extension-module",
  "abi3",
  "abi3-py310",
] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pyo3-pylogger = "0.5"
rust_decimal = "1.36"
tokio = { version = "1.52", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-stream = "0.1"

tonic = { version = "0.14", default-features = false, features = [
  "transport",
  "codegen",
  "router",
] }
uuid = "1.11.0"
url = "2"

[build-dependencies]
prost-build = "0.14"
prost-types = "0.14"
rustc_version = "0.4.0"
url = "2"

[dev-dependencies]
tempfile = "3.17"

[lib]
name = "datafusion_ray"
crate-type = ["cdylib", "rlib"]

[package.metadata.maturin]
name = "datafusion_ray._datafusion_ray_internal"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = 0

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 1
